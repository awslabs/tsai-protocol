openapi: 3.1.0
info:
  title: TSAI Trust Authority API
  version: 1.0.0
  description: |
    Trust Authority API for issuing and refreshing TSAI credentials (SD-JWT VC).
    An agent proves control of the key its credential will be bound to, and the
    Trust Authority issues a short-lived credential carrying trust signals.
  contact:
    name: TSAI Working Group
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

tags:
  - name: credentials
    description: Credential issuance and refresh
  - name: metadata
    description: Trust Authority metadata and discovery

paths:
  /challenges:
    get:
      summary: Get proof-of-control challenge
      description: |
        Returns a single-use challenge the agent signs with the key its
        credential will be bound to. Challenges expire after 5 minutes.
      operationId: getChallenge
      tags: [credentials]
      responses:
        '200':
          description: Challenge generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/ServerError'

  /credentials/issue:
    post:
      summary: Issue a credential
      description: |
        Issues a TSAI credential. The agent proves control of the binding key
        by signing a challenge from /challenges. The Trust Authority associates
        that key with its evaluation of the agent and operator.
      operationId: issueCredential
      tags: [credentials]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueRequest'
      responses:
        '201':
          description: Credential issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/ServerError'

  /credentials/refresh:
    post:
      summary: Refresh a credential
      description: |
        Issues a fresh credential with a new expiry, given the current credential
        and proof of control of the same binding key.
      operationId: refreshCredential
      tags: [credentials]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Credential refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/ServerError'

  /metadata:
    get:
      summary: Get Trust Authority metadata
      description: Returns the issuer identifier, key discovery location, and endpoints.
      operationId: getMetadata
      tags: [metadata]
      responses:
        '200':
          description: Metadata retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TAMetadata'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  schemas:
    Challenge:
      type: object
      required: [challenge, expiresAt]
      properties:
        challenge:
          type: string
          description: Random nonce, hex-encoded, at least 32 bytes
          example: a1b2c3d4e5f67890abcdef1234567890abcdef1234567890abcdef1234567890
        expiresAt:
          type: string
          format: date-time
          example: '2026-01-23T10:05:00Z'

    ProofOfControl:
      type: object
      description: Proof that the agent controls the key its credential will be bound to.
      required: [jwk, challenge, signature]
      properties:
        jwk:
          type: object
          description: Public part of the binding key, placed in the credential's cnf
          example:
            kty: OKP
            crv: Ed25519
            x: O8G5X-9Zichaemqq4fFOqQ3SyYI18A4INI1oWPWlLcc
        challenge:
          type: string
          example: a1b2c3d4e5f67890abcdef1234567890abcdef1234567890abcdef1234567890
        signature:
          type: string
          description: Base64url-encoded signature over the challenge, made with the binding key
          example: 3q2-7w...

    IssueRequest:
      type: object
      required: [proofOfControl]
      properties:
        proofOfControl:
          $ref: '#/components/schemas/ProofOfControl'
        sub:
          type: string
          format: uri
          description: Optional requested stable HTTPS name for the agent
          example: 'https://acme-corp.example/agents/shopper-v3'

    RefreshRequest:
      type: object
      required: [currentCredential, proofOfControl]
      properties:
        currentCredential:
          type: string
          description: The current credential (SD-JWT VC issuer-signed JWT)
          example: eyJhbGciOiJFZERTQSIsInR5cCI6ImRjK3NkLWp3dCJ9...
        proofOfControl:
          $ref: '#/components/schemas/ProofOfControl'

    CredentialResponse:
      type: object
      required: [credential, format, issuedAt, expiresAt]
      properties:
        credential:
          type: string
          description: The issued credential (SD-JWT VC issuer-signed JWT)
          example: eyJhbGciOiJFZERTQSIsInR5cCI6ImRjK3NkLWp3dCJ9...
        format:
          type: string
          enum: [dc+sd-jwt]
          example: dc+sd-jwt
        issuedAt:
          type: string
          format: date-time
          example: '2026-01-23T10:00:00Z'
        expiresAt:
          type: string
          format: date-time
          description: 30 minutes after issuedAt
          example: '2026-01-23T10:30:00Z'

    TAMetadata:
      type: object
      required: [tsaiVersion, issuer, name, jwksUri, endpoints]
      properties:
        tsaiVersion:
          type: string
          example: '1.0'
        issuer:
          type: string
          format: uri
          description: The Trust Authority HTTPS issuer identifier
          example: 'https://trust-authority.example'
        name:
          type: string
          example: Example Trust Authority
        description:
          type: string
          example: Professional trust authority for agentic commerce
        jwksUri:
          type: string
          format: uri
          description: Issuer key discovery
          example: 'https://trust-authority.example/.well-known/jwt-vc-issuer'
        endpoints:
          type: object
          required: [issue, refresh, challenges]
          properties:
            issue:
              type: string
              format: uri
            refresh:
              type: string
              format: uri
            challenges:
              type: string
              format: uri

    Error:
      type: object
      required: [error, error_description]
      properties:
        error:
          type: string
          example: invalid_request
        error_description:
          type: string
          example: proofOfControl signature did not verify

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_request
            error_description: proofOfControl is required
    Unauthorized:
      description: Proof of control failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_proof
            error_description: Signature over the challenge did not verify
    Forbidden:
      description: Agent not eligible or blocked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_eligible
            error_description: The agent does not meet the criteria for the requested signals
    Gone:
      description: The current credential has expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: credential_expired
            error_description: Credential expired, request new issuance
    RateLimitExceeded:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until retry allowed
          schema:
            type: integer
            example: 45
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: rate_limit_exceeded
            error_description: Maximum 10 issuance requests per minute
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: server_error
            error_description: Credential signing service unavailable
