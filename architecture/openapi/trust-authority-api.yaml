openapi: 3.1.0
info:
  title: TSAI Trust Authority API
  version: 1.0.0
  description: |
    Trust Authority API for issuing and refreshing TSAI credentials (SD-JWT VC).
    An agent proves control of the key its credential will be bound to, and the
    Trust Authority issues a short-lived ES256-signed credential carrying trust signals.
  contact:
    name: TSAI Working Group
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://trust-authority.example
    description: >-
      The Trust Authority origin. The API endpoints (challenges, credentials,
      status, metadata) MAY instead be mounted under a path prefix. The status
      report remains origin-rooted. Issuer metadata starts at the origin-rooted
      /.well-known/jwt-vc-issuer suffix and appends any issuer path, per the
      SD-JWT VC insertion rule (Section 2.8, Section 3.2.1).

tags:
  - name: credentials
    description: Credential issuance and refresh
  - name: metadata
    description: Trust Authority metadata and discovery

paths:
  /challenges:
    get:
      summary: Get proof-of-control challenge
      description: |
        Returns a single-use challenge the agent signs with the key its
        credential will be bound to. Challenges expire after 5 minutes.
      operationId: getChallenge
      tags: [credentials]
      responses:
        '200':
          description: Challenge generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/ServerError'

  /credentials/issue:
    post:
      summary: Issue a credential
      description: |
        Issues a TSAI credential. The agent proves control of the binding key
        by signing a challenge from /challenges. The Trust Authority associates
        that key with its evaluation of the agent and operator.
      operationId: issueCredential
      tags: [credentials]
      security:
        - operatorAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueRequest'
      responses:
        '201':
          description: Credential issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/ServerError'

  /credentials/refresh:
    post:
      summary: Refresh a credential
      description: |
        Issues a fresh credential with a new expiry, given the current credential
        and proof of control of the same binding key.
      operationId: refreshCredential
      tags: [credentials]
      security:
        - operatorAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Credential refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/ServerError'

  /credentials/repudiate:
    post:
      summary: Repudiate a binding key
      description: |
        An enrolled operator repudiates a binding key. The Trust Authority
        refuses further issuance against it and blocks the affected agent
        (Section 7.6).
      operationId: repudiateKey
      tags: [credentials]
      security:
        - operatorAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jwkThumbprint]
              properties:
                jwkThumbprint:
                  type: string
                  description: RFC 7638 thumbprint of the binding key to repudiate
      responses:
        '204':
          description: Repudiated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/ServerError'

  /.well-known/jwt-vc-issuer:
    get:
      summary: SD-JWT VC issuer metadata (signing keys)
      description: >-
        Returns the issuer metadata document containing jwks or jwks_uri. This
        literal path is for an issuer without a path component. For an issuer
        such as https://ta.example/tenant/acme, the same operation is served at
        /.well-known/jwt-vc-issuer/tenant/acme under the SD-JWT VC insertion
        rule, regardless of any API base path.
      operationId: getIssuerMetadata
      tags: [metadata]
      responses:
        '200':
          description: Issuer metadata
          content:
            application/json:
              schema: { type: object }
        '500':
          $ref: '#/components/responses/ServerError'

  /.well-known/tsai-ta-status:
    get:
      summary: Signed operational status report (Section 7.10)
      description: >-
        Origin-rooted: served at the origin root regardless of any API base path.
      operationId: getStatusReport
      tags: [metadata]
      responses:
        '200':
          description: Signed status report
          content:
            application/json:
              schema: { type: object }
        '500':
          $ref: '#/components/responses/ServerError'

  /status/{listId}:
    get:
      summary: Agent-and-operator Token Status List
      operationId: getStatusList
      tags: [credentials]
      parameters:
        - name: listId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Token Status List token
          content:
            application/statuslist+jwt:
              schema: { type: string }
        '500':
          $ref: '#/components/responses/ServerError'

  /metadata:
    get:
      summary: Get Trust Authority metadata
      description: Returns the issuer identifier, key discovery location, supported credential types, and endpoints.
      operationId: getMetadata
      tags: [metadata]
      responses:
        '200':
          description: Metadata retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TAMetadata'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    operatorAuth:
      type: http
      scheme: bearer
      description: >-
        The operator's authenticated session, established out of band at
        enrolment (Section 7.2). Issuance, refresh, and repudiation run
        within it; proof of control then proves the binding key.
  schemas:
    Challenge:
      type: object
      required: [challenge, expiresAt]
      properties:
        challenge:
          type: string
          description: Random nonce, hex-encoded, at least 32 bytes
          example: a1b2c3d4e5f67890abcdef1234567890abcdef1234567890abcdef1234567890
        expiresAt:
          type: string
          format: date-time
          example: '2026-01-23T10:05:00Z'

    ProofOfControl:
      type: object
      description: Proof that the agent controls the EC/P-256 key its credential will be bound to, using ES256.
      required: [jwk, challenge, signature]
      properties:
        jwk:
          type: object
          description: Public EC/P-256 binding key, placed in the credential's cnf
          required: [kty, crv, x, y]
          properties:
            kty: { type: string, enum: [EC] }
            crv: { type: string, enum: [P-256] }
            x: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
            y: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
            alg: { type: string, enum: [ES256] }
            use: { type: string, enum: [sig] }
          not:
            required: [d]
          additionalProperties: true
          example:
            kty: EC
            crv: P-256
            x: TCAER19Zvu3OHF4j4W4vfSVoHIP1ILilDls7vCeGemc
            y: ZxjiWWbZMQGHVWKVQ4hbSIirsVfuecCE6t4jT9F2HZQ
        challenge:
          type: string
          example: a1b2c3d4e5f67890abcdef1234567890abcdef1234567890abcdef1234567890
        signature:
          type: string
          description: Base64url-encoded 64-octet R || S ES256 signature over the UTF-8 bytes of the challenge value exactly as received
          pattern: '^[A-Za-z0-9_-]{86}$'
          example: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8gISIjJCUmJygpKissLS4vMDEyMzQ1Njc4OTo7PD0-Pw

    IssueRequest:
      type: object
      required: [proofOfControl]
      properties:
        proofOfControl:
          $ref: '#/components/schemas/ProofOfControl'
        sub:
          type: string
          format: uri
          description: Optional requested stable HTTPS name for the agent
          example: 'https://acme-corp.example/agents/shopper-v3'
        signals:
          type: array
          description: >-
            Optional holder-directed filter (ADR 015): request a subset of
            categories or types above the identity floor, without naming the
            Service Provider. The identity floor is always included regardless
            of the filter, and the filter can never remove a signal the
            applicable credential schema requires. The Trust Authority stays blind to the
            destination.
          items:
            type: object
            required: [cat]
            properties:
              cat: { type: string, enum: [idn, rep, cmp, asr] }
              typ: { type: string }

    RefreshRequest:
      type: object
      required: [currentCredential, proofOfControl]
      properties:
        currentCredential:
          type: string
          description: The current credential (SD-JWT VC issuer-signed JWT)
          example: eyJhbGciOiJFUzI1NiIsInR5cCI6ImRjK3NkLWp3dCJ9...
        proofOfControl:
          $ref: '#/components/schemas/ProofOfControl'

    CredentialResponse:
      type: object
      required: [credential, format, issuedAt, expiresAt]
      properties:
        credential:
          type: string
          description: The issued credential (SD-JWT VC issuer-signed JWT)
          example: eyJhbGciOiJFUzI1NiIsInR5cCI6ImRjK3NkLWp3dCJ9...
        format:
          type: string
          enum: [dc+sd-jwt]
          example: dc+sd-jwt
        issuedAt:
          type: string
          format: date-time
          example: '2026-01-23T10:00:00Z'
        expiresAt:
          type: string
          format: date-time
          description: 30 minutes after issuedAt
          example: '2026-01-23T10:30:00Z'

    TAMetadata:
      type: object
      required: [tsaiVersion, issuer, name, jwksUri, credentialTypes, endpoints]
      properties:
        tsaiVersion:
          type: string
          example: '1.0'
        issuer:
          type: string
          format: uri
          description: The Trust Authority HTTPS issuer identifier
          example: 'https://trust-authority.example'
        name:
          type: string
          example: Example Trust Authority
        description:
          type: string
          example: Professional trust authority for agentic commerce
        jwksUri:
          type: string
          format: uri
          description: Issuer key discovery
          example: 'https://trust-authority.example/.well-known/jwt-vc-issuer'
        credentialTypes:
          type: array
          minItems: 1
          description: >-
            Credential type identifiers this Trust Authority issues. The Type
            Metadata at each vct identifies and integrity-pins its JSON Schema;
            this list does not duplicate schema locations.
          items:
            type: string
            format: uri
          example:
            - 'https://tsaiprotocol.org/credential/tsai/1'
            - 'https://trust-authority.example/credential/tsai/1'
        endpoints:
          type: object
          required: [issue, refresh, challenges]
          properties:
            issue:
              type: string
              format: uri
            refresh:
              type: string
              format: uri
            challenges:
              type: string
              format: uri

    Error:
      type: object
      required: [error, error_description]
      properties:
        error:
          type: string
          example: invalid_request
        error_description:
          type: string
          example: proofOfControl signature did not verify

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_request
            error_description: proofOfControl is required
    Unauthorized:
      description: Proof of control failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_proof
            error_description: Signature over the challenge did not verify
    Forbidden:
      description: Agent not eligible or blocked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_eligible
            error_description: The agent does not meet the criteria for the requested signals
    Gone:
      description: The current credential has expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: credential_expired
            error_description: Credential expired, request new issuance
    RateLimitExceeded:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until retry allowed
          schema:
            type: integer
            example: 45
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: rate_limit_exceeded
            error_description: Maximum 10 issuance requests per minute
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: server_error
            error_description: Credential signing service unavailable
